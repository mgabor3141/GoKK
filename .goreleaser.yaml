# GoReleaser configuration: https://goreleaser.com
# Release with: git tag v0.1.0 && git push --tags  (see .github/workflows/release.yml)
version: 2

project_name: bkk

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bkk
    main: ./cmd/bkk
    binary: bkk
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.*\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.*\))?!?:'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
      - '^ci'
      - '^style'

# Fork-release branch only: upstream pins the release target to bancsdan/GoKK,
# which a fork's GITHUB_TOKEN cannot write to (403). Empty means "the repository
# this workflow runs in", which is what we want here. Delete this whole branch
# once the BKK_BASE_URL patch is merged upstream and we track bancsdan's releases.
release:
  draft: false
  prerelease: auto
  # A re-run of a failed workflow must not trip over the assets the first
  # attempt already uploaded.
  replace_existing_artifacts: true

# Upstream publishes a cask to bancsdan/homebrew-tap. Dropped on this branch:
# we have no tap repository and no HOMEBREW_TAP_GITHUB_TOKEN, and a cask we do
# not own would only fail the release after every useful asset is already built.
